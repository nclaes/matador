# Matador Training Configuration
#
# Place this file in your work directory (mounted as /work inside the container).
# Run: matador train --config /work/training_config.yaml
#
# Training multiple models in the same /work? Each model needs its OWN copy
# of this file (matador train --config accepts any path/filename). Name it
# after the model: <model_name>_training_config.yaml (matching matador
# booleanize's own <name>_train.txt/<name>_report.json convention) --
# e.g. training_config.yaml (or digits_training_config.yaml) for the first
# model, sports_training_config.yaml for a second one on a different
# dataset. Only the OUTPUT is auto-namespaced per model_name (see below);
# the config file itself is not, so reusing one file across models means
# re-editing train_data/test_data (and losing track of the previous
# model's settings) every time you switch. `matador`/`matador status` list
# every training config actually present in /work and what model_name each
# one targets.
#
# Training multiple DIFFERENTLY SIZED models from the SAME dataset (e.g. a
# small and a large digits model)? train_data alone can't tell them apart
# -- set model_name: explicitly and differently in each one (see below),
# and name the file to match, e.g. digits_small_training_config.yaml /
# digits_large_training_config.yaml. Without an explicit model_name:, both
# would default to the same name derived from train_data and the second
# `matador train` run would silently overwrite the first model's output.
#
# DATA REQUIREMENT: All feature values must already be Boolean (0 or 1).
# Files must be space-separated with the class label as the final column.
# Example row (4 features, class 2): 1 0 1 1 2

# Tsetlin Machine type: "vanilla" or "coalesced"
tm_type: vanilla

# Number of clauses (must be even; more clauses = higher capacity, slower training)
clauses: 400

# Number of classes in the dataset (e.g. 10 for digit recognition)
classes: 10

# Number of Boolean input features per sample
features: 512

# Specificity parameter — controls how broadly clauses generalise (float, typically 2.0–10.0)
s: 5.0

# Voting threshold — controls confidence required before a clause counts (integer)
T: 200

# Number of training epochs
epochs: 50

# Maximum number of literals allowed per clause (set to features*2 to disable)
max_included_literals: 32

# Random seed for reproducibility
seed: 42

# Paths to training and test data files (absolute or relative to this config file)
train_data: /work/data/train.txt
test_data: /work/data/test.txt

# Optional: names this model's output directory (<output_dir>/TMIR/<model_name>/),
# so training several models into the same work directory doesn't overwrite
# an earlier one's validation_config.yaml/rom_inference.py/etc. If omitted,
# derived from train_data's filename (e.g. digits_train.txt -> "digits") --
# matching `matador booleanize`'s own <name>_train.txt convention, so the
# ingest -> booleanize -> train chain needs no extra configuration here.
# REQUIRED (and must be distinct) if you're training more than one model
# from the SAME dataset (e.g. different hyperparameters/sizes) -- without
# it, both configs derive the same name from train_data and collide.
# model_name: my_model

# Directory where trained TA state files and logs will be written
# (matador train always writes into <output_dir>/TMIR/<model_name>/)
output_dir: /work
