# Generates Coalesced-TM RTL from an existing TAs.txt/weights.txt pair.
# Independent of training_config.yaml -- tas/weights can come from
# `coal_tm train`'s output, or be supplied directly, as here.
#
# This example matches the TAs.txt/weights.txt already checked into the
# repo root (/workspace/TAs.txt, /workspace/weights.txt inside the
# container) -- a pretrained 200-clause, 10-class MNIST digit model.
# test_data below points at a small, real 100-row sample of MNIST test
# data checked into examples/ for exactly this purpose (785 columns per
# row = 784 features + 1 label; the full ~105MB MNIST train+test set is
# NOT bundled -- see training_config.yaml). Copy this file into /work and
# run it as-is to see the whole flow work with zero setup:
#
#   coal_tm validate  --config /work/rtl_config.yaml --n-vectors 20
#   coal_tm generate  --config /work/rtl_config.yaml
#   coal_tm testbench --config /work/rtl_config.yaml --n-vectors 20
#   coal_tm sim       --rtl-dir /work/mnist_model/RTL
#
output_dir: /work/mnist_model
tas: /workspace/TAs.txt
weights: /workspace/weights.txt
classes: 10
clauses: 200
features: 784
bus_width: 64          # must be < features (multiple of 8) -- see README.md
                       # "Known limitation: bus_width must be less than features"
                       # for a small model (features <= bus_width), pick a
                       # narrower bus_width (e.g. 32/16/8) instead
adder_stages: 1        # must evenly divide `clauses`
test_data: /workspace/examples/sample_mnist_test.txt   # needed for `coal_tm validate`/`testbench`
