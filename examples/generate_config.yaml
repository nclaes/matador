# generate_config.yaml — shared RTL generation config template
#
# --backend is REQUIRED on every `matador generate` invocation (see
# `matador list-backends` for the full set) — there is no bare
# `matador generate` that builds multiple backends from one command.
# This file's fields cover vanilla_tiled and vanilla_hardwired only (they
# happen to share model_path/output_dir/axis_data_width/fifo_depth, plus
# their own distinct knobs below); vanilla_gp_tiled's config shape is
# genuinely different (target_fpga/capacity fields, not feat_slice/
# clause_slice/pipeline_stages) — use examples/vanilla_gp_tiled.yaml for it.
#
#   matador generate --backend vanilla_tiled     --config examples/generate_config.yaml
#   matador generate --backend vanilla_hardwired --config examples/generate_config.yaml
#
# Output is written to:
#   <output_dir>/vanilla_tiled/RTL/       — tiled backend
#   <output_dir>/vanilla_hardwired/RTL/   — hardwired backend
#
# Prerequisites: a trained TMIR model at model_path (from `matador train`).

# Path to the trained TMIR model file (.yaml or .npz).
model_path: /work/TMIR/<model_name>/TM_TMIR_Clauses_400_s_value_5_T_value_200_epochs_50_max_literals_32.yaml

# Root output directory.  Backend subdirectories are created automatically.
output_dir: /work

# AXI-Stream TDATA width in bits (shared by all backends).
# Allowed: 32 or 64.
axis_data_width: 32

# Input FIFO depth in beats (shared by all backends).
# Must be a power of 2, minimum 4.
fifo_depth: 16

# ── Tiled backend knobs ───────────────────────────────────────────────────────
# feat_slice  — features (and literals) evaluated per tile column.
#   Outer FSM loop steps through ceil(n_features / feat_slice) feature slices.
#   Powers of 2 recommended; 4–16 is a good starting range.
feat_slice: 8

# clause_slice — clauses evaluated in parallel per tile cycle.
#   Inner FSM loop steps through ceil(n_clauses_total / clause_slice) slices.
#   Larger values cut inference latency at the cost of more parallel LUTs.
clause_slice: 8

# ── Hardwired backend knobs ──────────────────────────────────────────────────
# pipeline_stages — register stages in the clause-score adder tree.
#   0 = fully combinational (min latency, may miss timing at high clock).
#   ceil(log2(n_clauses_per_class / 2)) = fully pipelined (best Fmax).
#   For 400 clauses: ceil(log2(200)) = 8.  Default 3 is a safe middle ground.
pipeline_stages: 3
