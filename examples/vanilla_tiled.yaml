# vanilla_tiled.yaml — Tiled accelerator backend configuration
#
# Usage:
#   matador generate --backend vanilla_tiled --config examples/vanilla_tiled.yaml
#
# Architecture: sequential FSM iterates over (N_FEAT_SLICES × N_CLAUSE_SLICES)
# tiles per inference, reading Include-action bits from an on-chip tile ROM
# each cycle.  CLAUSE_SLICE clause_eval instances run in parallel per cycle.
#
# Prerequisites: a trained TMIR model at model_path (from `matador train`).

# Path to the trained TMIR model file (.yaml or .npz).
model_path: /work/TMIR/<model_name>/TM_TMIR_Clauses_400_s_value_5_T_value_200_epochs_50_max_literals_32.yaml

# Root output directory.  RTL is written to <output_dir>/RTL/.
output_dir: /work

# AXI-Stream TDATA width in bits.  Features are packed LSB-first.
# Allowed: 32 or 64.
axis_data_width: 32

# Input FIFO depth in beats (must be a power of 2, minimum 4).
fifo_depth: 16

# feat_slice — features (and literals) evaluated per tile column.
#   Outer FSM loop steps through ceil(n_features / feat_slice) feature slices.
#   Powers of 2 map cleanly to BRAM port widths; 4–16 is a good starting range.
feat_slice: 8

# clause_slice — clauses evaluated in parallel per tile cycle.
#   Inner FSM loop steps through ceil(n_clauses_total / clause_slice) clause slices.
#   Larger values reduce inference latency at the cost of more LUTs.
clause_slice: 8
