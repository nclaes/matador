services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: matador:dev
    volumes:
      - ..:/workspace
    network_mode: host      # simplifies Vivado licence server connectivity
    tty: true
    stdin_open: true
    working_dir: /workspace
