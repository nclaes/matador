services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: coal_tm:dev
    hostname: coal-tm
    volumes:
      - ..:/workspace
      # Optional: set WORK_DIR in your shell before running docker compose
      # to mount a host directory as /work inside the container.
      - ${WORK_DIR:-/tmp}:/work
    tty: true
    stdin_open: true
    working_dir: /workspace
